<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kalaas</title>
<style>
  html,body{margin:0;height:100%}
  body{background:var(--surface-100);color:var(--ink);font-family:var(--font-sans);overflow:hidden}
  .cover{position:relative;height:288px;overflow:hidden}
  .art{position:absolute;top:0;left:480px;width:480px;height:288px;overflow:hidden}
  .art svg{display:block;width:480px;height:288px}
  .navy{fill:var(--navy-900)}
  .navy2{fill:var(--navy-700)}
  .gold{fill:var(--gold-500)}
  .tint{fill:var(--gold-100)}
  [data-theme="dark"] .navy{fill:var(--navy-700)}
  [data-theme="dark"] .navy2{fill:var(--ink-muted)}
  .blk{rx:var(--radius-lg)}
  .pill{rx:4px}
  .words{position:absolute;left:var(--space-8);bottom:var(--space-8);max-width:440px}
  .name{margin:0;font-size:112px;line-height:.92;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
  .tag{margin:var(--space-2) 0 0 6px;font-size:14px;line-height:20px;color:var(--ink-muted)}
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      navy-900 176×320 bled off top and bottom (identity, largest; navy-700 in dark where navy-900 is the ground) · gold-500 144×176 · gold-100 144×96 (relief) · navy-700 112×112 — ≈40% of 960×288
  arrangement one tall navy slab with satellites stepping right, gutters space-4, the gold block a step lower than the tint like a rising score
  pattern     pills from "badges radius-pill, Poppins rounded": eight gold pills (height space-2) stacked as a bar-chart of progress inside the navy slab
  scales      sides in space-4/space-8 multiples; gutters space-4; pill pitch space-4; corners radius-lg, pills half their height
-->
<rect class="navy blk" x="32" y="-16" width="176" height="320" rx="16"/>
<rect class="pill gold" x="56" y="80" width="48" height="8"/>
<rect class="pill gold" x="56" y="104" width="80" height="8"/>
<rect class="pill gold" x="56" y="128" width="64" height="8"/>
<rect class="pill gold" x="56" y="152" width="112" height="8"/>
<rect class="pill gold" x="56" y="176" width="96" height="8"/>
<rect class="pill gold" x="56" y="200" width="128" height="8"/>
<rect class="pill tint" x="56" y="224" width="40" height="8"/>
<rect class="pill tint" x="104" y="224" width="24" height="8"/>
<rect class="tint blk" x="224" y="32" width="144" height="96" rx="16"/>
<rect class="gold blk" x="224" y="144" width="144" height="176" rx="16"/>
<rect class="navy2 blk" x="384" y="80" width="112" height="112" rx="16"/>
</svg>
</div>
<div class="words">
<h1 class="name">Kalaas</h1>
<p class="tag">Gérer son institut de formation, simplement.</p>
</div>
</div>
</body>
</html>
