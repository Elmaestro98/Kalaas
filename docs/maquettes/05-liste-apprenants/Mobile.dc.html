<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kalaas — Apprenants mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kalaas/tokens.css">
<link rel="stylesheet" href="ds/kalaas/components/bundle.css">
<script src="ds/kalaas/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"Poppins",system-ui,sans-serif;background:#F7F5F0;color:#0D1B2A}
a{color:#7A5F22}a:hover{color:#0D1B2A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<header style="background: var(--surface-200); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between"><div><h1 style="margin: 0; font-size: 20px; font-weight: 600">Apprenants</h1><div style="font-size: 12px; color: var(--ink-muted)">214 inscrits · 2026-2027</div></div><button type="button" aria-label="Importer ou exporter" style="width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-200); color: var(--ink); font-size: 18px">⋯</button></div>
<label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-100); color: var(--ink-muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" aria-label="Rechercher" placeholder="Nom, matricule ou téléphone" style="flex-grow: 1; border: 0; background: transparent; font-family: inherit; font-size: 15px; outline: none"></label>
<div style="display: flex; gap: 8px; overflow: hidden">
<button type="button" aria-pressed="true" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--navy-900); color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Tous 214</button>
<button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-200); font-family: inherit; font-size: 13px">En retard 42</button>
<button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-200); font-family: inherit; font-size: 13px">À jour 148</button>
<button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-200); font-family: inherit; font-size: 13px">Soldés 24</button>
</div>
</header>

<main style="padding: 12px 16px 100px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<a href="#" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--surface-200); border: 1px solid var(--border); border-radius: 14px; color: var(--ink); text-decoration: none">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: var(--gold-100); color: var(--gold-700); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center">{{r.ini}}</span>
<div style="flex-grow: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">{{r.nom}}</div><div style="font-size: 12px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.fil}}</div></div>
<sc-if value="{{r.late}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kalaas.Badge" tone="danger">{{r.badge}}</x-import></sc-if>
<sc-if value="{{r.ok}}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="Kalaas.Badge" tone="success">{{r.badge}}</x-import></sc-if>
<sc-if value="{{r.done}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kalaas.Badge" tone="neutral">{{r.badge}}</x-import></sc-if>
</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px">
<div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #EEEAE1"><div style="width: {{r.pct}}; height: 5px; border-radius: 3px; background: var(--navy-900)"></div></div>
<span style="white-space: nowrap; color: var(--ink-muted)">Reste <b style="color: var(--ink); font-weight: 600">{{r.reste}}</b></span>
</div>
</a>
</sc-for>
</main>

<button type="button" aria-label="Inscrire un apprenant" style="position: absolute; right: 16px; bottom: 24px; height: 56px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--navy-900); color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; box-shadow: 0 8px 24px rgba(13,27,42,0.3); display: flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Inscrire</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var d = [
      ['Moussa Ndiaye', 'Développement Web & Mobile', 300000, 450000, 0],
      ['Awa Diop', 'Comptabilité & Gestion', 210000, 350000, 0],
      ['Cheikh Fall', 'Réseaux & Télécoms', 500000, 500000, 0],
      ['Fatou Sow', 'Couture & Modélisme', 90000, 250000, 12],
      ['Aminata Ba', 'Marketing Digital', 180000, 300000, 0],
      ['Ibrahima Sarr', 'Développement Web & Mobile', 150000, 450000, 18],
      ['Mariama Diallo', 'Comptabilité & Gestion', 140000, 350000, 10],
      ['Babacar Seck', 'Couture & Modélisme', 250000, 250000, 0]
    ];
    var fmt = function (n) { return n.toLocaleString('fr-FR').replace(/ | /g, ' '); };
    return { rows: d.map(function (x) {
      var done = x[2] >= x[3], late = !done && x[4] > 0;
      return { nom: x[0], fil: x[1], ini: x[0].split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2),
        pct: Math.round(x[2] / x[3] * 100) + '%', reste: done ? '0' : fmt(x[3] - x[2]),
        late: late, ok: !late && !done, done: done, badge: done ? 'Soldé' : late ? 'Retard ' + x[4] + ' j' : 'À jour' };
    }) };
  }
}
</script>
</body>
</html>
