<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kalaas — Impayés mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kalaas/tokens.css">
<link rel="stylesheet" href="ds/kalaas/components/bundle.css">
<script src="ds/kalaas/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"Poppins",system-ui,sans-serif;background:#F7F5F0;color:#0D1B2A}
a{color:#7A5F22}a:hover{color:#0D1B2A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1080px; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<header style="background: var(--navy-900); color: #FFFFFF; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">Impayés</h1>
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div><div style="font-size: 12px; color: #C9CFD8">En retard · 23 apprenants</div><div style="white-space: nowrap"><span style="font-size: 30px; font-weight: 700; color: var(--gold-500)">870 000</span> <span style="font-size: 13px; color: #C9CFD8">FCFA</span></div></div>
<div style="text-align: right; font-size: 12px; color: #C9CFD8">Récupéré en oct.<br><b style="color: #FFFFFF; font-size: 15px; font-weight: 600">320 000</b></div>
</div>
</header>

<div style="display: flex; gap: 8px; padding: 14px 16px 4px; overflow: hidden">
<button type="button" aria-pressed="true" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--navy-900); color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Plus anciens</button>
<button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: #FFFFFF; font-family: inherit; font-size: 13px">Promesses · 3</button>
<button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: #FFFFFF; font-family: inherit; font-size: 13px">Jamais relancés</button>
</div>

<main style="padding: 10px 16px 110px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="background: var(--surface-200); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; gap: 10px">
<div style="flex-grow: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">{{r.nom}}</div><div style="font-size: 12px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.last}}</div></div>
<div style="text-align: right"><div style="font-size: 15px; font-weight: 700; white-space: nowrap">{{r.du}}</div>
<sc-if value="{{r.mild}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Kalaas.Badge" tone="warning">{{r.jours}}</x-import></sc-if>
<sc-if value="{{r.bad}}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="Kalaas.Badge" tone="danger">{{r.jours}}</x-import></sc-if>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 1px solid var(--border); border-radius: 10px; color: var(--ink); font-size: 14px; font-weight: 500; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E7A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg>Relancer</a>
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 1px solid var(--border); border-radius: 10px; color: var(--ink); font-size: 14px; font-weight: 500; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>Appeler</a>
</div>
</div>
</sc-for>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface-200); border-top: 1px solid var(--border); padding: 12px 16px 24px">
<x-import component-from-global-scope="Kalaas.Button" variant="primary" size="lg" style="width: 100%">Relancer les 23 sur WhatsApp</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var d = [
      ['Mamadou L. Ndao', '50 000', 30, '5 relances · tuteur prévenu'],
      ['Ibrahima Sarr', '45 000', 25, '4 relances · dernière non lue'],
      ['Fatou Sow', '80 000', 20, 'Promesse : paiera le 15 oct.'],
      ['Awa Diop', '66 667', 9, 'Relancée le 8 oct. · lue'],
      ['Oumou K. Diouf', '33 333', 9, 'Numéro invalide à corriger'],
      ['Babacar Seck', '40 000', 8, 'Relancé le 3 oct. · lu']
    ];
    return { rows: d.map(function (x) { return { nom: x[0], du: x[1], jours: x[2] + ' j', mild: x[2] < 8, bad: x[2] >= 8, last: x[3] }; }) };
  }
}
</script>
</body>
</html>
