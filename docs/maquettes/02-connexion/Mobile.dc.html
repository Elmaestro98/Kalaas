<!doctype html>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<header style="position: relative; background: var(--navy-900); color: #FFFFFF; padding: 28px 24px 72px; overflow: hidden">
<div style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Kalaas<span style="color: var(--gold-500)">.</span></div>
<div style="margin-top: 20px; font-size: 22px; line-height: 30px; font-weight: 600">Votre institut vous attend.</div>
<svg aria-hidden="true" width="120" height="80" viewBox="0 0 120 80" style="position: absolute; right: -10px; top: 26px"><rect x="0" y="0" width="60" height="8" rx="4" fill="#C4A35A"></rect><rect x="0" y="20" width="100" height="8" rx="4" fill="#C4A35A"></rect><rect x="0" y="40" width="80" height="8" rx="4" fill="#C4A35A"></rect><rect x="0" y="60" width="120" height="8" rx="4" fill="#2A3F57"></rect></svg>

<main style="margin: -44px 16px 0; background: var(--surface-200); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-card); padding: 24px 20px; display: flex; flex-direction: column; gap: 18px">
<div><h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600">Connexion</h1><p style="margin: 2px 0 0; font-size: 14px; line-height: 22px; color: var(--ink-muted)">Accédez à l’espace de votre institut.</p></div>
<div role="tablist" aria-label="Méthode de connexion" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface-100); border: 1px solid var(--border); border-radius: 12px">
<button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; color: #0D1B2A; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 1px 3px rgba(13,27,42,0.12)">E-mail</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: #5B6675; font-family: inherit; font-size: 14px; font-weight: 500">Téléphone</button>
</div>
<x-import component-from-global-scope="Kalaas.Input" label="Adresse e-mail" type="email" placeholder="vous@votre-institut.sn"></x-import>
<div class="kl-field">
<div style="display: flex; justify-content: space-between; align-items: baseline"><label class="kl-field-label" for="pwdm">Mot de passe</label><a href="#" style="font-size: 13px; font-weight: 500">Oublié ?</a></div>
<div style="position: relative"><input id="pwdm" class="kl-input" type="password" placeholder="Votre mot de passe" style="padding-right: 52px"><button type="button" aria-label="Afficher le mot de passe" style="position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 40px; border: 0; background: transparent; color: var(--ink-muted); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 24px"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #0D1B2A">Rester connecté</label>
<x-import component-from-global-scope="Kalaas.Button" variant="primary" size="lg" style="width: 100%">Se connecter</x-import>
<x-import component-from-global-scope="Kalaas.Button" variant="secondary" size="lg" style="width: 100%">Continuer avec Google</x-import>
</main>
<div style="padding: 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-muted); text-align: center">
<p style="margin: 0">Pas encore de compte ? <a href="#" style="font-weight: 600">Créer mon institut</a></p>
<a href="#" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink); font-weight: 500; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E7A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg>Besoin d’aide ? Support WhatsApp</a>
</div>
</div>
