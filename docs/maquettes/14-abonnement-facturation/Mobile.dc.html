<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kalaas — Abonnement mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kalaas/tokens.css">
<link rel="stylesheet" href="ds/kalaas/components/bundle.css">
<script src="ds/kalaas/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"Poppins",system-ui,sans-serif;background:#F7F5F0;color:#0D1B2A}
a{color:#7A5F22}a:hover{color:#0D1B2A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<header style="background: var(--surface-200); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; gap: 4px">
<a href="#" aria-label="Retour aux paramètres" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">Abonnement</h1>
</header>
<main style="padding: 16px 16px 130px; display: flex; flex-direction: column; gap: 14px">
<section style="background: var(--navy-900); color: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #E6D3A3">ESSAI GRATUIT · PRO</div>
<div style="font-size: 20px; font-weight: 600">Encore 9 jours</div>
<div style="font-size: 13px; color: #C9CFD8">Jusqu’au 15 octobre 2026</div>
<div style="height: 6px; border-radius: 3px; background: var(--navy-700)"><div style="width: 36%; height: 6px; border-radius: 3px; background: var(--gold-500)"></div></div>
</section>
<section style="background: var(--surface-200); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div><div style="display: flex; justify-content: space-between; font-size: 13px"><span>Apprenants</span><b style="font-weight: 600">214 / 300</b></div><div style="height: 5px; border-radius: 3px; background: #EEEAE1; margin-top: 5px"><div style="width: 71%; height: 5px; border-radius: 3px; background: var(--navy-900)"></div></div></div>
<div><div style="display: flex; justify-content: space-between; font-size: 13px"><span>Comptes de l’équipe</span><b style="font-weight: 600">4 / 5</b></div><div style="height: 5px; border-radius: 3px; background: #EEEAE1; margin-top: 5px"><div style="width: 80%; height: 5px; border-radius: 3px; background: var(--navy-900)"></div></div></div>
<div><div style="display: flex; justify-content: space-between; font-size: 13px"><span>Messages WhatsApp</span><b style="font-weight: 600">120 / 500</b></div><div style="height: 5px; border-radius: 3px; background: #EEEAE1; margin-top: 5px"><div style="width: 24%; height: 5px; border-radius: 3px; background: var(--navy-900)"></div></div></div>
</section>
<h2 style="margin: 4px 4px 0; font-size: 16px; font-weight: 600">Formule</h2>
<div role="radiogroup" aria-label="Formule" style="display: flex; flex-direction: column; gap: 8px">
<div aria-disabled="true" style="padding: 14px 16px; border: 1px dashed var(--border); border-radius: 14px; background: var(--surface-100)"><div style="display: flex; justify-content: space-between; color: #6B7482"><span style="font-weight: 600">Essentiel</span><span><b style="font-weight: 700">10 000</b> / mois</span></div><div style="font-size: 12px; color: var(--warning); font-weight: 600; margin-top: 2px">Limite de 100 apprenants dépassée</div></div>
<button type="button" role="radio" aria-checked="true" style="padding: 14px 16px; border: 2px solid var(--navy-900); border-radius: 14px; background: var(--gold-100); font-family: inherit; text-align: left; color: var(--ink)"><div style="display: flex; justify-content: space-between"><span style="font-weight: 600">Pro</span><span><b style="font-weight: 700">20 000</b> / mois</span></div><div style="font-size: 12px; color: var(--ink-muted); margin-top: 2px">300 apprenants · 5 comptes · relances WhatsApp</div></button>
<button type="button" role="radio" aria-checked="false" style="padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; background: #FFFFFF; font-family: inherit; text-align: left; color: var(--ink)"><div style="display: flex; justify-content: space-between"><span style="font-weight: 600">Premium</span><span><b style="font-weight: 700">35 000</b> / mois</span></div><div style="font-size: 12px; color: var(--ink-muted); margin-top: 2px">Illimité · plusieurs campus</div></button>
</div>
<div style="padding: 12px 14px; background: var(--surface-200); border: 1px solid var(--border); border-radius: 12px; font-size: 13px; display: flex; justify-content: space-between; align-items: center"><span>Payer à l’année : <b style="font-weight: 600">200 000</b> (2 mois offerts)</span><a href="#" style="font-weight: 600">Choisir</a></div>
</main>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface-200); border-top: 1px solid var(--border); padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px">
<div role="radiogroup" aria-label="Moyen de paiement" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" role="radio" aria-checked="true" style="height: 40px; border: 2px solid var(--navy-900); border-radius: 10px; background: var(--gold-100); font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink)">Wave</button>
<button type="button" role="radio" aria-checked="false" style="height: 40px; border: 1px solid var(--border); border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 14px; color: var(--ink)">Orange Money</button>
</div>
<x-import component-from-global-scope="Kalaas.Button" variant="primary" size="lg" style="width: 100%">Payer 20 000 FCFA avec Wave</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
